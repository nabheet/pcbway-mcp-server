name: CI

# Single workflow file — this filename is the ONE trusted publisher
# configured on npm (ci.yml). CI on PRs, publish on push to main (stable),
# v*-beta* tag push (beta prerelease), or manual dispatch (staging beta).
#
# Stable version comes from the npm registry (last published `latest` +
# patch), not from a possibly-stale package.json, so repeated merges never
# collide. An intentional minor/major bump in package.json is honored: if the
# working tree version is ahead of the registry, it is published as-is.
#
# npm trusted publishing (OIDC) auto-generates provenance — no token needed.
#
# Publish failures are retried 3x for transient issues only — a version
# conflict (already published) is NEVER retried. Publish serialized via
# concurrency; CI runs on the same ref are cancelled when superseded.
#
# RELEASE RULE (enforced by the "changes" step in `publish`): publish UNLESS
# every path changed since the last release (newest stable v* tag) is
# non-shipping.
#   * NON-shipping (never cut a release): package-lock.json, .github/**, and
#     package.json when its only diffs are version and/or the INERT
#     devDependencies (the allowlist in the step: @types/node, vitest,
#     @vitest/coverage-v8 — build/test only, never in dist/).
#   * Everything else ships: src/** (compiled into dist/, which the package
#     publishes), README.md and LICENSE (listed in `files`), and package.json
#     when any shipping field changes — including a `typescript` bump, which is
#     deliberately NOT inert because it compiles dist/.
#
# The baseline is the last RELEASE tag, not this push's `before`, so a
# shipping change whose publish failed stays "unreleased" and is retried by
# the next run, including on a later non-shipping push. See
# galactic-config/empire/docs/ops/ci-cd-standard.md §14.

on:
  push:
    branches: [main]
    tags: ["v*-beta*"]
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    concurrency:
      # Cancels superseded PR runs only. Never cancel a push to main:
      # cancellation kills the whole run, including its `publish` job, and the
      # follow-up non-shipping push would then skip — losing the release.
      # github.head_ref is set only on pull_request events, so main pushes and
      # tag pushes fall back to the unique run id and never cancel each other.
      group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: node dist/index.js --help

  publish:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    concurrency:
      group: publish
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write # trusted publishing (OIDC)
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # The "changes" step below diffs the last release tag (or, with no
          # tag yet, github.event.before) against github.sha. actions/checkout
          # is SHALLOW by default and omits those commits and the tags, so
          # `git diff`/`git describe` would fail — or, worse, the guard would
          # look correct and never fire.
          fetch-depth: 0

      # Implements the RELEASE RULE documented at the top of this file. Writes
      # changed=true|false to $GITHUB_OUTPUT; every later step is gated on it,
      # so a non-shipping push produces no build, no publish, no tag and no
      # Release.
      #
      # The baseline is the last RELEASE (newest stable v* tag), not this
      # push's `before`. A per-push baseline loses a release when a shipping
      # push's publish fails: the next non-shipping push diffs only itself and
      # skips, and the unshipped change waits for the next shipping push.
      # Diffing from the last released commit means any unreleased shipping
      # change is re-detected on every later run, so the publish retries.
      - name: Determine whether there are unreleased shipping changes
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          emit() { # $1 = true|false (written to the step output), $2 = log line
            echo "changed=$1" >> "$GITHUB_OUTPUT"
            echo "$2"
          }

          # A beta tag push (v*-beta*) is an explicit release request.
          if [ "$REF_TYPE" = "tag" ]; then
            emit true "tag push: publishing"
            exit 0
          fi

          # Manual dispatch = staging beta: a human asked for it.
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            emit true "workflow_dispatch: publishing"
            exit 0
          fi

          # Newest STABLE release tag marks the last commit that shipped. Beta
          # tags are excluded — they are prereleases, not the released baseline
          # — and the tag survives force-pushes, where `before` can be
          # unreachable.
          BASE="$(git describe --tags --abbrev=0 --match 'v*' --exclude 'v*-beta*' 2>/dev/null || true)"
          if [ -n "$BASE" ]; then
            echo "Baseline: last stable release tag ${BASE}"
          else
            # No stable release tag yet (first release): fall back to this push.
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              emit true "no release tag and no usable before commit: publishing"
              exit 0
            fi
            BASE="$BEFORE"
            echo "Baseline: no stable release tag yet, using before commit ${BASE}"
          fi

          # Shallow-checkout trap. If the baseline commit is not present, fail
          # loudly instead of skipping (or falsely publishing) a release.
          if ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            echo "::error::baseline commit ${BASE} is not in this checkout; actions/checkout needs fetch-depth: 0 with tags"
            exit 1
          fi

          # Squash merges make tag..sha exactly the unreleased diff.
          # --no-renames: with rename detection on, `--name-only` reports only
          # the NEW path of a rename, so a rename INTO a non-shipping path would
          # hide the shipping source (e.g. `git mv src/a.ts .github/a.ts`).
          changed_paths="$(git diff --no-renames --name-only "$BASE" "$SHA")"
          echo "Paths changed by ${BASE}..${SHA}:"
          printf '%s\n' "$changed_paths"

          # package.json ships when any field other than version and an INERT
          # devDependency differs. INERT is the explicit list below (build/test
          # only, never in dist/); EVERYTHING ELSE defaults to shipping, so
          # `typescript` (which compiles dist/) and any future bundler or
          # compiler plugin still cut a release when bumped. jq -S normalises
          # key order; on any error (e.g. file absent) treat it as shipping.
          INERT_DEVDEPS='["@types/node","@vitest/coverage-v8","vitest"]'
          pkg_shipping_changed() {
            local before after
            # Single quotes are deliberate: $inert/$k are jq variables, not
            # shell ones.
            # shellcheck disable=SC2016
            local normalise='del(.version)
              | if has("devDependencies")
                then .devDependencies |= with_entries(select(.key as $k | ($inert | index($k)) | not))
                else . end
              | if (.devDependencies // {}) == {} then del(.devDependencies) else . end'
            before="$(git show "${BASE}:package.json" 2>/dev/null | jq -S --argjson inert "$INERT_DEVDEPS" "$normalise")" || return 0
            after="$(git show "${SHA}:package.json" 2>/dev/null | jq -S --argjson inert "$INERT_DEVDEPS" "$normalise")" || return 0
            [ "$before" != "$after" ]
          }

          publish=false
          while IFS= read -r path; do
            [ -z "$path" ] && continue
            case "$path" in
              package-lock.json|.github/*)
                echo "  skip:    $path (non-shipping)"
                ;;
              package.json)
                if pkg_shipping_changed; then
                  echo "  PUBLISH: $path (a shipping field changed)"
                  publish=true
                else
                  echo "  skip:    $path (only version/inert devDependencies changed)"
                fi
                ;;
              *)
                echo "  PUBLISH: $path"
                publish=true
                ;;
            esac
          done <<< "$changed_paths"

          emit "$publish" "RESULT: changed=$publish"

      - uses: actions/setup-node@v7
        if: steps.changes.outputs.changed == 'true'
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org/
      - run: npm ci
        if: steps.changes.outputs.changed == 'true'
        timeout-minutes: 2
      - run: npm run build
        if: steps.changes.outputs.changed == 'true'
        timeout-minutes: 2
      - name: Determine channel (latest / beta)
        id: channel
        if: steps.changes.outputs.changed == 'true'
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "tag=beta" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            # manual staging: next -beta.X after the last published beta
            CUR=$(npm pkg get version | tr -d '"')
            LAST_BETA=$(npm view pcbway-mcp-server@beta version 2>/dev/null || true)
            if [ -n "$LAST_BETA" ]; then
              LAST_BASE="${LAST_BETA%-beta.*}"
              NEXT_BASE=$(printf '%s\n' "$CUR" "$LAST_BASE" | sort -V | tail -1)
              if [ "$NEXT_BASE" = "$LAST_BASE" ] && [ "$NEXT_BASE" != "$CUR" ]; then
                N="${LAST_BETA##*-beta.}"
                npm version "${NEXT_BASE}-beta.$((N + 1))" --no-git-tag-version --no-commit-hooks
              else
                npm version prerelease --preid=beta --no-git-tag-version --no-commit-hooks
              fi
            else
              npm version prerelease --preid=beta --no-git-tag-version --no-commit-hooks
            fi
            echo "tag=beta" >> "$GITHUB_OUTPUT"
          else
            # merge to main -> next patch after the last published `latest`
            LAST=$(npm view pcbway-mcp-server@latest version 2>/dev/null || true)
            CUR=$(npm pkg get version | tr -d '"')
            if [ -n "$LAST" ] && [ "$(printf '%s\n%s' "$CUR" "$LAST" | sort -V | tail -1)" = "$LAST" ]; then
              # tree at/below registry -> align to registry (unless equal),
              # then bump patch; npm errors on "Version not changed" if the
              # align target equals the current version
              if [ "$CUR" != "$LAST" ]; then
                npm version "$LAST" --no-git-tag-version --no-commit-hooks
              fi
              npm version patch --no-git-tag-version --no-commit-hooks
            else
              # tree version ahead (intentional minor/major bump) -> as-is
              :
            fi
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi
      - name: Show publishing target
        if: steps.changes.outputs.changed == 'true'
        run: 'echo "Publishing $(npm pkg get version) to tag ${{ steps.channel.outputs.tag }}"'
      - name: Publish (retry transient only)
        if: steps.changes.outputs.changed == 'true'
        timeout-minutes: 5
        run: |
          for i in $(seq 1 3); do
            OUT=$(npm publish --tag ${{ steps.channel.outputs.tag }} --provenance --access public 2>&1) && { echo "$OUT"; exit 0; }
            if echo "$OUT" | grep -qE "cannot publish over|previously published"; then
              echo "$OUT" >&2
              echo "Version conflict — not retrying" >&2
              exit 1
            fi
            echo "$OUT"
            echo "Publish failed (transient?), retrying ($i/3)..."
            sleep 3
          done
          exit 1
      - name: Push tag (stable only)
        id: tag
        if: steps.changes.outputs.changed == 'true' && steps.channel.outputs.tag == 'latest'
        run: |
          V=$(npm pkg get version | tr -d '"')
          echo "published=$V" >> "$GITHUB_OUTPUT"
          git tag "v$V"
          git push origin "v$V"
      - uses: softprops/action-gh-release@v3
        if: steps.changes.outputs.changed == 'true' && steps.channel.outputs.tag == 'latest'
        with:
          tag_name: v${{ steps.tag.outputs.published }}
          generate_release_notes: true
      - uses: softprops/action-gh-release@v3
        if: steps.changes.outputs.changed == 'true' && github.ref_type == 'tag'
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: true

  # Per-PR beta prerelease: every PR push publishes a unique <version>-beta.<run_number>
  # to the npm `beta` dist-tag, so every PR is instantly installable
  # (`npm i pcbway-mcp-server@beta`). run_number increases per workflow run, so
  # each push gets a unique version; re-runs collide with themselves and are
  # deduped (conflict = exit 0). Same-repo, non-draft, non-dependabot PRs only.
  prerelease:
    runs-on: ubuntu-latest
    needs: test
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    concurrency:
      group: pr-prerelease-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
      id-token: write # trusted publishing (OIDC)
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org/
      - run: npm ci
      - run: npm run build
      - name: Compute prerelease version
        id: version
        run: |
          BASE=$(npm pkg get version | tr -d '"')
          echo "version=${BASE}-beta.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
      - name: Set version (no git change)
        run: npm version "${{ steps.version.outputs.version }}" --no-git-tag-version --no-commit-hooks
      - name: Publish beta prerelease
        timeout-minutes: 5
        run: |
          for i in $(seq 1 3); do
            OUT=$(npm publish --tag beta --provenance --access public 2>&1) && { echo "$OUT"; exit 0; }
            if echo "$OUT" | grep -qE "cannot publish over|previously published"; then
              echo "$OUT" >&2
              echo "Version conflict (workflow re-run) — deduped" >&2
              exit 0
            fi
            echo "$OUT"
            echo "Publish failed (transient?), retrying ($i/3)..."
            sleep 3
          done
          exit 1
      - name: Comment version on PR
        uses: actions/github-script@v9
        with:
          script: |
            const body = `Beta prerelease published: \`${{ steps.version.outputs.version }}\` — installable with \`npm i pcbway-mcp-server@beta\`.`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number
            });
            const marker = comments.find(c => c.user.login === 'github-actions[bot]' && c.body.startsWith('Beta prerelease published:'));
            if (marker) {
              await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: marker.id, body });
            } else {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body });
            }
